<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dividend calendar</title>
<style>
  body { margin: 0; font: 16px/1.5 system-ui, sans-serif; color: #1f2933; background: #f5f7fa; }
  main { max-width: 720px; margin: 0 auto; padding: 16px; }
  .card { background: #fff; border: 1px solid #d9e2ec; border-radius: 10px; padding: 16px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .task { font-size: 12px; color: #52606d; border: 1px solid #d9e2ec; border-radius: 4px; padding: 1px 6px; }
  .months { display: flex; gap: 6px; margin: 12px 0; flex-wrap: wrap; }
  .months button { border: 1px solid #9aa5b1; background: #fff; border-radius: 6px; padding: 8px 12px; font: inherit; cursor: pointer; }
  .months button[aria-pressed="true"] { background: #1d4ed8; color: #fff; border-color: #1d4ed8; font-weight: 600; }
  ul { list-style: none; margin: 0; padding: 0; }
  li { border-top: 1px solid #d9e2ec; padding: 12px 0; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .sec { font-weight: 600; }
  .date { color: #52606d; font-size: 14px; }
  .net { font-weight: 600; text-align: right; }
  .gross { color: #52606d; font-size: 14px; text-align: right; }
  @media (max-width: 480px) { .net { display: none; } }
  .empty { color: #52606d; padding: 16px 0; }
</style>
</head>
<body>
<main>
  <div class="card">
    <h1>Dividend calendar <span class="task">T1 T2</span></h1>
    <p class="date">Expected 2025 payments from Austrian securities, net after 27.5% KESt.</p>
    <div class="months" role="group" aria-label="Month"></div>
    <ul id="list"></ul>
  </div>
</main>
<script>
  const pay = [
    { m: 3, d: "2025-03-12", sec: "Erste Group", gross: 84.20, net: 61.05 },
    { m: 3, d: "2025-03-28", sec: "Austrian Gov. Bond 2031", gross: 120.00, net: 87.00 },
    { m: 4, d: "2025-04-15", sec: "Verbund AG", gross: 31.50, net: 22.84 },
    { m: 6, d: "2025-06-02", sec: "OMV AG", gross: 46.80, net: 33.93 }
  ];
  const names = ["January","February","March","April","May","June"];
  let month = 3;
  const box = document.querySelector(".months");
  names.forEach((n, i) => {
    const b = document.createElement("button");
    b.textContent = n.slice(0, 3);
    b.addEventListener("click", () => { month = i + 1; render(); });
    box.appendChild(b);
  });
  const eur = n => "€" + n.toFixed(2);
  function render() {
    box.querySelectorAll("button").forEach((b, i) => b.setAttribute("aria-pressed", String(i + 1 === month)));
    const r = pay.filter(p => p.m === month);
    document.getElementById("list").innerHTML = r.length ? r.map(p =>
      `<li><div><div class="sec">${p.sec}</div><div class="date">${p.d}</div></div><div><div class="net">${eur(p.net)} net</div><div class="gross">${eur(p.gross)} gross</div></div></li>`
    ).join("") : `<li class="empty">No payments expected in ${names[month - 1]}.</li>`;
  }
  render();
</script>
</body>
</html>
