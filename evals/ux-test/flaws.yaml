# Answer key for prototype/index.html. Never give this file, or the repo, to a tester.
# severity: Nielsen 0-4. reveal: what it takes to see the flaw.
# heuristic: Nielsen's 10 (H1 visibility of status ... H10 help and documentation).
- id: F01
  task: T1
  location: Add transaction dialog, save button
  flaw: The save button is a floppy-disk icon with no text, label or tooltip.
  heuristic: H6 recognition rather than recall
  severity: 2
  reveal: interaction
- id: F02
  task: T1
  location: Add transaction dialog, Date field
  flaw: The placeholder says YYYY-MM-DD but only DD.MM.YYYY is accepted; the error just says "Invalid input." without naming the field or format.
  heuristic: H9 help users recognise, diagnose and recover from errors
  severity: 3
  reveal: interaction
